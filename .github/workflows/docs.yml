name: Docs

on:
  pull_request:
  # Both jobs read only the working tree, so either can be re-run by hand -- for
  # example when an external link rots without any commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    # Deterministic: no network, and the same input always gives the same
    # answer. This is the half `main` requires.
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # First, so that a later failure cannot hide the result.
      - name: Check structure
        run: node ci/docs/check-docs.mjs

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24
        with:
          globs: |
            docs/**/*.md
            i18n/**/*.md
            Packages/**/Documentation~/**/*.md
            Packages/**/CHANGELOG.md
            .github/*.md
            README.md

      - name: Check repository-relative links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config .lychee.toml --offline --no-progress
            './docs/**/*.md' './i18n/**/*.md' './Packages/**/Documentation~/**/*.md'
            './Packages/**/CHANGELOG.md' './.github/*.md' './README.md'

  links:
    # Only the external URLs need the network, so this job stays advisory: an
    # unreachable third-party site must not be able to block a merge.
    name: Check external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check external links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config .lychee.toml --no-progress
            './docs/**/*.md' './i18n/**/*.md' './Packages/**/Documentation~/**/*.md'
            './Packages/**/CHANGELOG.md' './.github/*.md' './README.md'
