name: Docs

on:
  pull_request:
  # The Docs job reads only the working tree, so it can be re-run by hand -- for
  # example when an external link rots without any commit to trigger it.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            docs/**/*.md
            i18n/**/*.md
            Packages/**/Documentation~/**/*.md
            Packages/**/CHANGELOG.md
            README.md

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config .lychee.toml --no-progress
            './docs/**/*.md' './i18n/**/*.md' './Packages/**/Documentation~/**/*.md'
            './Packages/**/CHANGELOG.md' './README.md'

      - name: Check structure
        run: node ci/docs/check-docs.mjs
