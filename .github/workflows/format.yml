name: Format

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Whitespace (.editorconfig, K&R)
        run: dotnet format whitespace ci/format/Grow.Format.csproj --verify-no-changes
      - name: Headers and names
        run: dotnet format style ci/format/Grow.Format.csproj --diagnostics IDE0073 IDE1006 --verify-no-changes --severity info
